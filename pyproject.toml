[project]
name = "reachable"
version = "0.1.0"
description = "CVE triage by call-graph reachability, with a three-state verdict that never silently says 'safe'."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
